controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: position_controllers/JointGroupPositionController


joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0


position_controller:
  ros__parameters:
    # Only the 12 ACTUATED joints (mimicked joints follow automatically)
    joints:
      # Hip joints (4)
      - blhipmotorplate_link_joint
      - brhipmotorplate_link_joint
      - flhipmotorplate_link_joint
      - frhipmotorplate_link_joint
      
      # Upper leg joints (4)
      - blupperlegmotorplate_link_joint
      - brupperlegmotoplate_link_joint
      - flupperlegmotorplate_link_joint
      - frupperlegmotorplate_link_joint
      
      # Part1/knee joints (4) - these control part5 and pin5 via mimic
      - blpart1_link_joint
      - brpart1_link_joint
      - flpart1_link_joint
      - frpart1_link_joint

    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity